<style>
:root{--navy:#0d2b5b;--ocean:#1e5aa8;--aqua:#1ba7b8;--bg:#e9f0f7;--card:#fff;--text:#14202e;--muted:#6b7a8c;--line:#d9e2ec;--me:#cfe3f7;--gold:#ffe08a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1722;--card:#18232f;--text:#e6edf5;--muted:#8b9bb0;--line:#26364a;--me:#1e4d7a;--gold:#5a4a14}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
/* auth */
.auth{margin:auto;width:min(380px,92vw);background:var(--card);padding:28px;border-radius:20px;box-shadow:0 8px 30px #0002;text-align:center}
.auth img{width:130px;height:130px}
.auth h1{margin:8px 0 2px;color:var(--ocean);font-size:24px}
.auth p{margin:0 0 16px;color:var(--muted)}
.field{width:100%;padding:12px 14px;margin:6px 0;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--ocean);color:#fff;font-weight:600}
.btn.full{width:100%;margin-top:8px}
.btn.ghost{background:transparent;color:var(--ocean);border:1px solid var(--line)}
.btn.gray{background:var(--line);color:var(--text)}
.btn.red{background:#d32f2f}
.err{color:#d32f2f;min-height:20px;font-size:13px}
.link{background:none;border:0;color:var(--ocean);margin-top:10px}
/* header */
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap}
header img.logo{width:46px;height:46px;border-radius:50%}
header .t{font-weight:700;font-size:18px}
.rates{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.pill{background:#ffffff24;border-radius:10px;padding:2px 9px;font-size:13px;font-weight:600;white-space:nowrap}
.pill b{color:#7fd6e0;margin-right:4px}
.up{color:#5ee08a;font-size:10px}.dn{color:#ff7b7b;font-size:10px}
.rbtn{width:26px;height:26px;border-radius:50%;border:0;background:#ffffff24;color:#fff}
.rinfo{font-size:10px;color:#ffffffa0;margin-top:2px}
.sp{flex:1}
.hbtn{width:38px;height:38px;border-radius:50%;border:0;background:#ffffff24;color:#fff;font-size:22px}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{flex:1;min-width:90px;padding:10px 6px;background:none;border:0;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ocean);border-bottom-color:var(--ocean);font-weight:700}
main{flex:1;min-height:0;display:flex}
.page{flex:1;overflow:auto;padding:16px}
.wrap{max-width:900px;margin:0 auto}
/* avatar */
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden;flex:none;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.dot{position:absolute;right:0;bottom:0;width:30%;height:30%;border-radius:50%;border:2px solid var(--card);background:#9e9e9e}
.dot.on{background:#2ecc71}
/* chats */
.side{width:360px;max-width:100%;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
.search{margin:10px;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bg)}
.chips{display:flex;gap:6px;padding:0 10px 8px}
.chip{border:0;border-radius:16px;padding:6px 12px;background:var(--bg);color:var(--text)}
.chip.on{background:#bfe6ee;color:#0d2b5b;font-weight:600}
.list{overflow:auto;flex:1}
.row{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:hover,.row.on{background:var(--bg)}
.row .m{flex:1;min-width:0}
.row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:12px;color:var(--muted)}
.badge{display:inline-block;min-width:20px;padding:1px 6px;border-radius:10px;background:var(--aqua);color:#fff;font-size:12px;font-weight:700;margin-top:3px}
.pane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.phead{background:var(--card);padding:8px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.phead .tt{font-weight:700}
.phead .ss{font-size:12px;color:var(--muted)}
.msgs{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.empty{margin:auto;color:var(--muted);text-align:center}
.day{align-self:center;background:#00000014;border-radius:12px;padding:3px 12px;font-size:12px;color:var(--muted);margin:8px 0}
.mrow{display:flex;gap:6px;align-items:flex-end}
.mrow.me{justify-content:flex-end}
.bub{max-width:min(560px,78%);padding:7px 11px;border-radius:16px 16px 16px 4px;background:var(--card);cursor:default;word-break:break-word;white-space:pre-wrap}
.me .bub{background:var(--me);border-radius:16px 16px 4px 16px}
.bub .nm{font-size:12px;font-weight:700;cursor:pointer}
.bub .fw{font-size:12px;font-style:italic;color:var(--muted)}
.bub .rp{border-left:3px solid var(--aqua);background:#0000000f;border-radius:6px;padding:3px 8px;margin:3px 0;font-size:13px}
.bub .rp b{color:var(--aqua);display:block;font-size:12px}
.bub img.pic{max-width:300px;max-height:300px;border-radius:10px;display:block;margin-bottom:4px}
.bub .file{display:flex;gap:8px;align-items:center;padding:4px 0}
.bub .file small{display:block;color:var(--muted);font-size:11px}
.bub .tm{text-align:right;font-size:11px;color:var(--muted);white-space:nowrap}
.tick{font-weight:700;margin-left:4px}.tick.all{color:#1e88e5}
.mention{color:#1e88e5;font-weight:700}
.comp{background:var(--card);border-top:1px solid var(--line);padding:8px;position:relative}
.comp .bar{display:flex;align-items:center;gap:8px;padding:2px 8px 6px;border-left:3px solid var(--aqua);margin:0 8px 6px;font-size:13px}
.comp .bar span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crow{display:flex;gap:6px;align-items:flex-end}
.crow textarea{flex:1;resize:none;max-height:140px;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bg)}
.ibtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;font-size:22px}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--aqua);color:#fff;font-size:18px}
.send:disabled{background:#9e9e9e}
.sugg{position:absolute;left:60px;right:60px;bottom:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px #0003;max-height:240px;overflow:auto;z-index:5}
.sugg .row{padding:6px 10px}
/* modal */
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal{background:var(--card);border-radius:18px;padding:20px;min-width:min(320px,92vw);max-width:min(440px,94vw);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px}
.ctx{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px #0004;padding:6px;min-width:220px}
.menu .mi{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 8px;border-radius:8px;color:var(--text)}
.menu .mi:hover{background:var(--bg)}
.mi.red{color:#d32f2f}
.card-c{text-align:center}
.card-c .line{display:flex;gap:10px;align-items:center;padding:8px 0;text-align:left}
.card-c a{color:var(--ocean);text-decoration:none}
/* calc */
.hd{background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px}
.seg{display:flex;gap:6px;margin:6px 0 12px}
.seg button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.seg button.on{background:var(--ocean);color:#fff;border-color:var(--ocean)}
select.sel{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.rc{background:var(--card);border-radius:14px;padding:14px;margin:8px 0}
.rc.best{background:var(--gold);color:#3a3000}
@media (prefers-color-scheme:dark){.rc.best{color:#ffe9a8}}
.rc .p{font-size:24px;font-weight:700}
.rc .b{font-size:12px;font-weight:700}
.rc .sm{font-size:13px;opacity:.75}
h2.v{color:var(--ocean);margin:18px 0 0}
.chk{display:flex;gap:10px;margin-bottom:14px}
.chk label{flex:1;display:flex;gap:8px;align-items:center;background:var(--card);padding:12px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-weight:600}
.demo{color:#d32f2f;font-size:12px}
/* dept */
.dept{background:var(--card);border-radius:14px;margin:8px 0;overflow:hidden}
.dept>.dh{padding:12px 16px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between}
.alert{background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;border-left:4px solid var(--ocean)}
.alert.urgent{border-left-color:#d32f2f}
/* assistant */
.bot{max-width:90%;margin:8px 0}
.bot .bb{white-space:pre-wrap;display:inline-block;background:var(--card);border-radius:16px;padding:10px 14px}
.bot.me{text-align:right}.bot.me .bb{background:var(--me)}
.doc{background:var(--card);border-radius:14px;padding:12px;margin:6px 0;max-width:520px}
.doc .st{font-weight:600;font-size:13px;margin:4px 0}
@media (max-width:800px){
  .side{width:100%;border-right:0}
  .pane{display:none}
  .chatopen .side{display:none}
  .chatopen .pane{display:flex}
  .back{display:inline-block!important}
}
.back{display:none;border:0;background:none;font-size:22px;color:var(--text)}

/* компактные размеры */
header{padding:6px 12px;gap:10px}
header img.logo{width:40px;height:40px}
header .t{font-size:16px}
nav button{padding:8px 6px;font-size:14px}
.page{padding:12px}
.wrap{max-width:1180px}
.tb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:12px;padding:8px 14px;margin-bottom:10px}
.tb b{font-size:16px;margin-right:auto}
.tb label{display:flex;gap:6px;align-items:center;background:#ffffff1f;padding:5px 12px;border-radius:16px;cursor:pointer;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid2.one{grid-template-columns:minmax(0,760px)}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
.blk{background:var(--card);border-radius:14px;padding:12px 14px}
.bt{font-weight:700;color:var(--navy);font-size:16px;margin-bottom:8px}
@media (prefers-color-scheme:dark){.bt{color:#9ecbff}}
.ctrl{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.ctrl>div{flex:1;min-width:150px}
.ctrl label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
select.sel{padding:7px 10px;border-radius:10px;background:var(--bg)}
.seg{margin:0;gap:4px}
.seg button{padding:7px 4px;font-size:13px;border-radius:10px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media (max-width:640px){.vgrid{grid-template-columns:1fr}}
h2.v{margin:6px 0 2px;font-size:14px;color:var(--ocean)}
.rc{display:flex;gap:10px;align-items:center;padding:7px 10px;margin:4px 0;border-radius:10px;background:var(--bg)}
.rc.best{background:var(--gold)}
.rc .p{font-size:16px;font-weight:700;min-width:96px;white-space:nowrap}
.rc .c1{font-weight:600;font-size:14px;line-height:1.2}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:8px 0;padding:8px 14px;background:var(--card);border-radius:16px;width:fit-content}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(30,120,255,.2);border-top-color:#1e78ff;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.cityrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cityrow::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:14px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer;background:#ffe08a;color:#5a3d00}
.chip.on{background:var(--ocean);color:#fff}
.ctl2{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin-top:6px}
.ctl2 select.sel{flex:1 1 190px;padding:8px 10px;font-size:13px}
.ctl2 .seg{flex:3 1 330px;margin:0}
.ctl2 .seg button{padding:6px 6px;font-size:12px;line-height:1.2}
h2.v{margin:10px 0 0;font-size:15px}
.rc .sm{font-size:12px}
.rc .sm{font-size:12px;opacity:.75;line-height:1.2}
.demo{margin-bottom:6px}
.note{font-size:11px;color:var(--muted);margin-top:8px}
.dept>.dh{padding:8px 14px}
.row{padding:8px 12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;align-items:start}
.dept{margin:0;border-radius:12px}
.dept>.dh{padding:7px 12px;font-size:14px;border-bottom:1px solid var(--line)}
.cnt{background:var(--bg);border-radius:10px;padding:0 8px;font-size:12px;color:var(--muted);align-self:center}
.prow{display:flex;gap:8px;align-items:center;padding:4px 12px;cursor:pointer}
.prow:hover{background:var(--bg)}
.pm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.pn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* юристы */
.cn{background:var(--card);border-radius:12px;padding:10px 14px;margin:8px 0;border-left:4px solid #f5b400}
.cn.approved{border-left-color:#2e7d32}.cn.revision{border-left-color:#ef6c00}.cn.rejected{border-left-color:#c62828}
.cn .tt{font-weight:700}
.cn .sm{font-size:12px;color:var(--muted)}
.cn .fl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.cn .fl a{background:var(--bg);border-radius:14px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--ocean)}
.cn .cm{background:var(--bg);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:14px}
.cn .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btn.sm2{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.green{background:#2e7d32}.btn.orange{background:#ef6c00}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:8px 0 2px}
</style>
</head>

const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const money = v => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽";
const pad = n => String(n).padStart(2, "0");

const fmtDay = t => { const d = new Date(t), n = new Date();

  if (same(d, n)) return "Сегодня"; if (same(d, new Date(n - 864e5))) return "Вчера";
  return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear(); };

function download(name, b64) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr]));

}
